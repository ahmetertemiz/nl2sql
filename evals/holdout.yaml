- id: 104
  soru: ortalamanın üstünde harcama yapan kaç müşteri var?
  referans_sql: >-
    WITH h AS (SELECT o.customer_id, SUM(oi.quantity * oi.unit_price) AS toplam
               FROM orders o JOIN order_items oi ON oi.order_id = o.id
               WHERE o.status = 'tamamlandi' GROUP BY o.customer_id)
    SELECT COUNT(*) FROM h WHERE toplam > (SELECT AVG(toplam) FROM h)
  yorum: Ortalama = müşteri başına toplam harcamanın ortalaması (harcaması olan müşteriler arasında).
  zorluk: zor
  kategori: iki-adim
  sirali: false

- id: 105
  soru: Ekimde ciro eylüle göre yüzde kaç arttı?
  referans_sql: >-
    WITH m AS (SELECT strftime('%Y-%m', o.order_date) AS ay, SUM(oi.quantity * oi.unit_price) AS ciro
               FROM orders o JOIN order_items oi ON oi.order_id = o.id
               WHERE o.status = 'tamamlandi' GROUP BY ay)
    SELECT 100.0 * (e.ciro - s.ciro) / s.ciro FROM m e, m s WHERE e.ay = '2026-10' AND s.ay = '2026-09'
  zorluk: orta
  kategori: iki-adim
  sirali: false

- id: 106
  soru: 2026'da her ay ne kadar ciro yaptık, bir de yılbaşından beri birikimli toplamı yanına koy
  referans_sql: >-
    SELECT ay, ciro, SUM(ciro) OVER (ORDER BY ay) AS kumulatif FROM (
      SELECT strftime('%Y-%m', o.order_date) AS ay, SUM(oi.quantity * oi.unit_price) AS ciro
      FROM orders o JOIN order_items oi ON oi.order_id = o.id
      WHERE o.status = 'tamamlandi' AND o.order_date >= '2026-01-01' GROUP BY ay)
    ORDER BY ay
  zorluk: zor
  kategori: pencere
  sirali: true

- id: 107
  soru: her kategorinin en çok satan ürünü hangisi? adet olarak
  referans_sql: >-
    SELECT category, name, adet FROM (
      SELECT p.category, p.name, SUM(oi.quantity) AS adet,
             RANK() OVER (PARTITION BY p.category ORDER BY SUM(oi.quantity) DESC) AS sira
      FROM order_items oi JOIN orders o ON o.id = oi.order_id JOIN products p ON p.id = oi.product_id
      WHERE o.status = 'tamamlandi' GROUP BY p.id)
    WHERE sira = 1
  yorum: Tamamlanan siparişler. Tüm durumlar sayılırsa sonuç değişebilir.
  zorluk: zor
  kategori: pencere
  sirali: false

- id: 108
  soru: En çok sipariş veren müşterimiz kim, kaç siparişi var?
  referans_sql: >-
    SELECT c.name, COUNT(*) AS n FROM orders o JOIN customers c ON c.id = o.customer_id
    GROUP BY c.id ORDER BY n DESC LIMIT 1
  yorum: >-
    Aynı adı taşıyan müşteriler var. Doğru cevap Emre Demir (15). Ada göre gruplamak 8 farklı
    "Zeynep Kaya"yı birleştirip 62 sipariş gösterir. Tüm durumlar sayılır.
  zorluk: orta
  kategori: ayni-ad
  sirali: false

