# AYRI TEST SETİ (holdout) — yalnızca ÖLÇMEK içindir.
#
# Kurallar:
#   - Bu setteki başarısızlıklara bakarak SYSTEM_PROMPT DEĞİŞTİRİLMEZ. Prompt'u bu sete göre
#     ayarlamak, sınava sorulara bakarak çalışmak olur; ölçüm anlamını yitirir.
#   - Sorular gerçek kullanıcı gibi yazılmıştır: belirsiz ifadeler, yazım hataları, günlük dil,
#     iki adımlı mantık, pencere fonksiyonları.
#   - "yorum": belirsiz sorularda referans SQL'in hangi yorumu seçtiği. Başarısızlıkları
#     sınıflandırırken (model hatası / belirsiz soru / hatalı referans) buna bakılır.
#
# Alanlar questions.yaml ile aynıdır (soru, referans_sql, zorluk, kategori, sirali) + yorum.
# "Bugün" 2026-11-20. Ciro/harcama: yalnızca tamamlanan siparişler, quantity * unit_price.

- id: 101
  soru: en iyi 5 müşterimiz kimler
  referans_sql: >-
    SELECT c.name, SUM(oi.quantity * oi.unit_price) AS ciro
    FROM customers c JOIN orders o ON o.customer_id = c.id JOIN order_items oi ON oi.order_id = o.id
    WHERE o.status = 'tamamlandi' GROUP BY c.id ORDER BY ciro DESC LIMIT 5
  yorum: '"En iyi" = tamamlanan siparişlerdeki toplam harcama. Sipariş sayısına göre de okunabilir.'
  zorluk: orta
  kategori: belirsiz
  sirali: false

- id: 102
  soru: satışlar son 6 ayda nasıl gidiyo, aylık ciroyu görmek istiyorum
  referans_sql: >-
    SELECT strftime('%Y-%m', o.order_date) AS ay, SUM(oi.quantity * oi.unit_price)
    FROM orders o JOIN order_items oi ON oi.order_id = o.id
    WHERE o.status = 'tamamlandi' AND o.order_date >= '2026-06-01'
    GROUP BY ay
  yorum: '"Son 6 ay" = içinde bulunulan Kasım dahil Haziran-Kasım. Kasım yarım ay; tam aylar (Mayıs-Ekim) da okunabilir.'
  zorluk: orta
  kategori: belirsiz
  sirali: false

