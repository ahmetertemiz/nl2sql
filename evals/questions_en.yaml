- id: 7
  soru: What is the total revenue by category?
  referans_sql: >-
    SELECT p.category, SUM(oi.quantity * oi.unit_price)
    FROM order_items oi JOIN orders o ON o.id = oi.order_id JOIN products p ON p.id = oi.product_id
    WHERE o.status = 'completed' GROUP BY p.category
  zorluk: orta
  varsayim_beklenir: true
  kategori: join
  sirali: false

- id: 8
  soru: What are the names and total revenue of the 5 customers who brought in the most revenue? Sort from highest to lowest.
  referans_sql: >-
    SELECT c.name, SUM(oi.quantity * oi.unit_price) AS revenue
    FROM order_items oi JOIN orders o ON o.id = oi.order_id JOIN customers c ON c.id = o.customer_id
    WHERE o.status = 'completed' GROUP BY c.id ORDER BY revenue DESC LIMIT 5
  zorluk: orta
  varsayim_beklenir: true
  kategori: join
  sirali: true

- id: 9
  soru: How many customers placed no orders at all last month? The order status does not matter.
  referans_sql: >-
    SELECT COUNT(*) FROM customers c WHERE NOT EXISTS
    (SELECT 1 FROM orders o WHERE o.customer_id = c.id AND strftime('%Y-%m', o.order_date) = '2026-10')
  zorluk: zor
  varsayim_beklenir: false
  kategori: join
  sirali: false

- id: 10
  soru: In completed orders of customers in London, how many units were sold in total from each category?
  referans_sql: >-
    SELECT p.category, SUM(oi.quantity)
    FROM order_items oi JOIN orders o ON o.id = oi.order_id
    JOIN customers c ON c.id = o.customer_id JOIN products p ON p.id = oi.product_id
    WHERE c.city = 'London' AND o.status = 'completed' GROUP BY p.category
  zorluk: zor
  varsayim_beklenir: false
  kategori: join
  sirali: false

- id: 11
  soru: How many orders were placed last month? Count all statuses.
  referans_sql: SELECT COUNT(*) FROM orders WHERE strftime('%Y-%m', order_date) = '2026-10'
