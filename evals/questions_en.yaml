- id: 12
  # 4, bilerek: 3. ve 4. ürün eşit (73 adet), "top 3" tek bir doğru cevaba sahip olmazdı.
  soru: In last month's completed orders, what are the names and unit sales of the 4 best-selling products by units?
  referans_sql: >-
    SELECT p.name, SUM(oi.quantity) AS units
    FROM order_items oi JOIN orders o ON o.id = oi.order_id JOIN products p ON p.id = oi.product_id
    WHERE o.status = 'completed' AND strftime('%Y-%m', o.order_date) = '2026-10'
    GROUP BY p.id ORDER BY units DESC LIMIT 4
  zorluk: orta
  varsayim_beklenir: false
  kategori: tarih
  sirali: false

- id: 13
  soru: What is the total revenue for each of the last 3 completed months? Show the month as YYYY-MM and sort from oldest to newest.
  referans_sql: >-
    SELECT strftime('%Y-%m', o.order_date) AS month, SUM(oi.quantity * oi.unit_price)
    FROM order_items oi JOIN orders o ON o.id = oi.order_id
    WHERE o.status = 'completed' AND o.order_date >= '2026-08-01' AND o.order_date < '2026-11-01'
    GROUP BY month ORDER BY month
  zorluk: zor
  varsayim_beklenir: true
  kategori: tarih
  sirali: true

- id: 14
  soru: What is the total revenue by month in 2026? Show the month as YYYY-MM and sort from oldest to newest.
  referans_sql: >-
    SELECT strftime('%Y-%m', o.order_date) AS month, SUM(oi.quantity * oi.unit_price)
    FROM order_items oi JOIN orders o ON o.id = oi.order_id
    WHERE o.status = 'completed' AND strftime('%Y', o.order_date) = '2026'
    GROUP BY month ORDER BY month
  zorluk: orta
  varsayim_beklenir: true
  kategori: tarih
  sirali: true

- id: 15
  # Sıfır satışlı ürünler de sonuçta olmalı: satış kalemlerinden başlayan bir INNER JOIN onları göremez.
  soru: In orders completed on October 2, 2026, what are the names and unit sales of products that sold fewer than 3 units?
  referans_sql: >-
    SELECT p.name, COALESCE(SUM(t.quantity), 0) AS units FROM products p
    LEFT JOIN (SELECT oi.product_id, oi.quantity FROM order_items oi JOIN orders o ON o.id = oi.order_id
               WHERE o.status = 'completed' AND o.order_date = '2026-10-02') t ON t.product_id = p.id
    GROUP BY p.id HAVING units < 3
  zorluk: zor
  varsayim_beklenir: true
  kategori: tarih
  sirali: false

- id: 16
  soru: What percentage of all orders were returned?
  referans_sql: SELECT 100.0 * SUM(status = 'returned') / COUNT(*) FROM orders
  zorluk: orta
  varsayim_beklenir: false
  kategori: oran
  sirali: false

- id: 17
  # ilk_satir: "which city" tek satır bekler, ama tüm şehirleri orana göre azalan sırada
  # listelemek de soruyu cevaplar (ilk satır en yüksek olandır). Liste doğru sıralıysa geçer.
  ilk_satir: true
  soru: Which city has the highest return rate among its customers' orders? Show the city and the return rate as a percentage.
  referans_sql: >-
    SELECT c.city, 100.0 * SUM(o.status = 'returned') / COUNT(*) AS rate
    FROM orders o JOIN customers c ON c.id = o.customer_id
    GROUP BY c.city ORDER BY rate DESC LIMIT 1
  zorluk: zor
  varsayim_beklenir: true
  kategori: oran
  sirali: false

- id: 18
  soru: For each category, what percentage of orders containing at least one product from that category were returned?
  referans_sql: >-
    SELECT p.category, 100.0 * COUNT(DISTINCT CASE WHEN o.status = 'returned' THEN o.id END) / COUNT(DISTINCT o.id)
    FROM orders o JOIN order_items oi ON oi.order_id = o.id JOIN products p ON p.id = oi.product_id
    GROUP BY p.category
  zorluk: zor
  varsayim_beklenir: true
  kategori: oran
  sirali: false

