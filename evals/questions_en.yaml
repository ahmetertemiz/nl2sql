# İngilizce değerlendirme seti: questions.yaml'daki 20 sorunun İngilizce karşılığı.
# Veritabanı: shop_en.db (seed_db.py --lang en). Aynı tohumla üretildiği için sayısal yapı
# shop.db ile aynıdır; yalnızca adlar, şehirler, kategoriler, durumlar ve para birimi farklıdır.
#
# Alanlar ve varsayim_beklenir ölçütü questions.yaml ile aynıdır (açıklama orada).
# Etiketler de aynı: 7, 8, 13, 14, 15, 17, 18 true; diğerleri false.
#
# Türkçe değerlerin karşılıkları (seed_db.LOCALES'te aynı sıradaki öğe):
#   tamamlandi/iptal/iade -> completed/cancelled/returned
#   İstanbul -> London, Ankara -> New York
#   Elektronik/Spor/Ev/Kitap/Aksesuar -> Electronics/Sports/Home/Books/Accessories
# Soru 3: "1000 TL üzeri" -> "$40 üzeri"; iki eşik aynı 8 ürünü seçer.
#
# "Today" is fixed at 2026-11-20 (seed_db.TODAY): "last month" = October 2026.

