- id: 6
  soru: Regardless of status, how many customers have placed at least 10 orders?
  referans_sql: >-
    SELECT COUNT(*) FROM (SELECT customer_id FROM orders GROUP BY customer_id HAVING COUNT(*) >= 10)
  zorluk: orta
  varsayim_beklenir: false
