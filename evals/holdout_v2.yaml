- id: 204
  soru: 2025te üye olanlar mı daha çok harcıyor 2026da üye olanlar mı? kişi başı ortalama harcamayı göster
  referans_sql: >-
    SELECT strftime('%Y', c.signup_date) AS yil, SUM(oi.quantity * oi.unit_price) / COUNT(DISTINCT c.id)
    FROM customers c JOIN orders o ON o.customer_id = c.id JOIN order_items oi ON oi.order_id = o.id
    WHERE o.status = 'tamamlandi' GROUP BY yil
  yorum: >-
    Kayıt yılına göre müşteri başına tamamlanan sipariş tutarı. Her müşterinin harcaması var, paydada belirsizlik yok.
  zorluk: zor
  kategori: iki-adim
  sirali: false
  varsayim_beklenir: true

- id: 205
  soru: aynı siparişte en sık birlikte alınan iki ürün hangileri
  referans_sql: >-
    SELECT p1.name, p2.name
    FROM order_items a JOIN order_items b ON a.order_id = b.order_id AND a.product_id < b.product_id
    JOIN products p1 ON p1.id = a.product_id JOIN products p2 ON p2.id = b.product_id
    GROUP BY a.product_id, b.product_id ORDER BY COUNT(*) DESC LIMIT 1
  yorum: >-
    Tüm siparişler: Koşu Ayakkabısı + Veri Bilimi Kitabı (33 sipariş). Yalnızca tamamlananlarda
    Kablosuz Kulaklık + Masa Lambası (30). İki ad ayrı sütunlarda beklenir.
  kabul_edilen:
    - >-
      SELECT p1.name, p2.name
      FROM order_items a JOIN order_items b ON a.order_id = b.order_id AND a.product_id < b.product_id
      JOIN orders o ON o.id = a.order_id
      JOIN products p1 ON p1.id = a.product_id JOIN products p2 ON p2.id = b.product_id
      WHERE o.status = 'tamamlandi'
      GROUP BY a.product_id, b.product_id ORDER BY COUNT(*) DESC LIMIT 1
  ilk_satir: true
  zorluk: zor
  kategori: kendine-join
  sirali: false
  varsayim_beklenir: true

