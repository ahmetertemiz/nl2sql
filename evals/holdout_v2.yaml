- id: 211
  soru: müşteriler ilk siparişten sonra ikinci siparişi ortalama kaç gün sonra veriyor
  referans_sql: >-
    WITH s AS (SELECT customer_id, order_date,
                      ROW_NUMBER() OVER (PARTITION BY customer_id ORDER BY order_date, id) AS rn FROM orders)
    SELECT AVG(julianday(b.order_date) - julianday(a.order_date))
    FROM s a JOIN s b ON a.customer_id = b.customer_id AND a.rn = 1 AND b.rn = 2
  yorum: >-
    Tüm durumlar, en az 2 siparişi olan müşteriler (45,87 gün). Yalnızca tamamlananlarla 44,87.
  kabul_edilen:
    - >-
      WITH s AS (SELECT customer_id, order_date,
                        ROW_NUMBER() OVER (PARTITION BY customer_id ORDER BY order_date, id) AS rn
                 FROM orders WHERE status = 'tamamlandi')
      SELECT AVG(julianday(b.order_date) - julianday(a.order_date))
      FROM s a JOIN s b ON a.customer_id = b.customer_id AND a.rn = 1 AND b.rn = 2
  zorluk: zor
  kategori: pencere
  sirali: false
  varsayim_beklenir: true

- id: 212
  soru: 2026da hangi aylarda ciro bir önceki aya göre düştü
  referans_sql: >-
    WITH m AS (SELECT strftime('%Y-%m', o.order_date) AS ay, SUM(oi.quantity * oi.unit_price) AS ciro
               FROM orders o JOIN order_items oi ON oi.order_id = o.id
               WHERE o.status = 'tamamlandi' GROUP BY ay),
         l AS (SELECT ay, ciro, LAG(ciro) OVER (ORDER BY ay) AS onceki FROM m)
    SELECT ay FROM l WHERE ay >= '2026-01' AND ciro < onceki
  yorum: >-
    Nisan, Mayıs, Ağustos, Kasım. Kasım henüz bitmedi (bugün 20 Kasım); yarım ayı dışarıda bırakmak da
    makul. Ocak, Aralık 2025 ile karşılaştırılır (düşüş yok).
  kabul_edilen:
    - >-
      WITH m AS (SELECT strftime('%Y-%m', o.order_date) AS ay, SUM(oi.quantity * oi.unit_price) AS ciro
                 FROM orders o JOIN order_items oi ON oi.order_id = o.id
                 WHERE o.status = 'tamamlandi' GROUP BY ay),
           l AS (SELECT ay, ciro, LAG(ciro) OVER (ORDER BY ay) AS onceki FROM m)
      SELECT ay FROM l WHERE ay >= '2026-01' AND ay < '2026-11' AND ciro < onceki
  zorluk: zor
  kategori: pencere
  sirali: false
  varsayim_beklenir: true

- id: 213
  soru: harcamasının yarısından fazlasını tek bir kategoriye yapan kaç müşteri var
  referans_sql: >-
    WITH k AS (SELECT o.customer_id AS cid, p.category, SUM(oi.quantity * oi.unit_price) AS t
               FROM orders o JOIN order_items oi ON oi.order_id = o.id JOIN products p ON p.id = oi.product_id
               WHERE o.status = 'tamamlandi' GROUP BY o.customer_id, p.category),
         tt AS (SELECT cid, SUM(t) AS toplam, MAX(t) AS en_buyuk FROM k GROUP BY cid)
    SELECT COUNT(*) FROM tt WHERE en_buyuk > toplam / 2.0
  yorum: >-
    Tamamlanan siparişler. Tam yarıda kalan müşteri yok, sınır belirsizliği sonucu etkilemez.
  zorluk: zor
  kategori: iki-adim
  sirali: false
  varsayim_beklenir: true

