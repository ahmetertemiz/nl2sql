# AYRI TEST SETİ v2 (holdout) — yalnızca ÖLÇMEK içindir. Yazım kılavuzu: evals/HOLDOUT_KILAVUZU.md
#
# Soruları prompt'u ve questions.yaml'ı görmeden yaz. Bu sete bakarak SYSTEM_PROMPT değiştirilmez.
# id'ler 201'den başlar (questions: 1-20, holdout v1: 101-120).
# Çalıştır: python evals/run_evals.py --set holdout_v2 --check-gold   (önce referansları doğrula)
#
# Şablon (kopyala, # işaretlerini kaldır, doldur):
#
# - id: 201
#   soru: gerçek bir kullanıcının yazacağı gibi, yazım hatası dahil
#   referans_sql: >-
#     SELECT ...
#   yorum: Soru belirsizse referansın hangi yorumu seçtiği (zorunlu değil)
#   kabul_edilen:            # isteğe bağlı: başka makul yorumların cevapları
#     - >-
#       SELECT ...
#   ilk_satir: false         # isteğe bağlı: tek satırlık soruda sıralı listenin ilk satırı yeterliyse true
#   zorluk: orta             # kolay | orta | zor
#   kategori: belirsiz       # serbest etiket: belirsiz, pencere, iki-adim, ayni-ad, cevaplanamaz...
#   sirali: false            # soru açıkça sıralama istiyorsa true
#
# Cevaplanamaz soru: referans_sql: null  (beklenen davranış: model SQL üretmez)
#
# Sorular 2026-11-22'de Claude (sohbet) tarafından yazıldı; referanslar shop.db üzerinde doğrulandı.
# Alternatif yorumlar (kabul_edilen) model cevapları görülmeden, soru yazılırken belirlendi.
# varsayim_beklenir: makul bir kullanıcı başka bir yorum bekleyebilir VE o yorum bu veride farklı sayı verir.

- id: 201
  soru: satış kalemlerinin yüzde kaçı liste fiyatının altında satılmış
  referans_sql: >-
    SELECT 100.0 * SUM(oi.unit_price < p.price) / COUNT(*)
    FROM order_items oi JOIN products p ON p.id = oi.product_id
  yorum: >-
    Tüm siparişlerin kalemleri (41,44). Yalnızca tamamlanan siparişler de makul (42,13).
  kabul_edilen:
    - >-
      SELECT 100.0 * SUM(oi.unit_price < p.price) / COUNT(*)
      FROM order_items oi JOIN products p ON p.id = oi.product_id JOIN orders o ON o.id = oi.order_id
      WHERE o.status = 'tamamlandi'
  zorluk: orta
  kategori: indirim
  sirali: false
  varsayim_beklenir: true

- id: 202
  soru: indirim yaptığımız için toplamda ne kadar gelirden olduk?
  referans_sql: >-
    SELECT SUM(oi.quantity * (p.price - oi.unit_price))
    FROM order_items oi JOIN products p ON p.id = oi.product_id JOIN orders o ON o.id = oi.order_id
    WHERE o.status = 'tamamlandi'
  yorum: >-
    Liste fiyatı ile satış fiyatı farkı x adet, yalnızca tamamlanan siparişler (iptal/iade gelir değildir).
  zorluk: zor
  kategori: indirim
  sirali: false
  varsayim_beklenir: true

- id: 203
