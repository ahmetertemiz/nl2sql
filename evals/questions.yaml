# "Bugün" 2026-11-20 olarak sabittir (seed_db.py ile aynı): "geçen ay" = Ekim 2026.
# Karşılaştırma sonuç üzerinden yapılır: modelin SQL'i farklı olabilir, sonuç aynı olmalı.

