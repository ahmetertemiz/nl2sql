# Değerlendirme seti: 20 Türkçe soru.
#
# Alanlar:
#   soru          modele sorulan metin
#   referans_sql  doğru cevabı veren SQL; null = şemayla cevaplanamaz (model SQL üretmemeli)
#   referans_sql_postgres  (isteğe bağlı) aynı cevabın PostgreSQL karşılığı; yalnızca SQLite'a özgü
#                 söz dizimi (strftime, SUM(koşul), HAVING'de takma ad) kullanan sorularda. Yoksa
#                 PostgreSQL'de de referans_sql kullanılır (run_evals.py --postgres).
#   zorluk        kolay | orta | zor
#   kategori      filtreleme | gruplama | join | tarih | oran | cevaplanamaz
#   sirali        true ise satır sırası da karşılaştırılır (soru sıralama istiyorsa)
#   kabul_edilen  (isteğe bağlı) ek referans SQL listesi; sorunun başka makul yorumları için
#   ilk_satir     (isteğe bağlı) true: tek satır beklenen soruda sıralı listenin ilk satırı yeterli
#                 Bu iki alan yalnızca gerçekten belirsiz sorularda, gerekçesiyle kullanılır.
#   varsayim_beklenir  true: modelin bir varsayım yazması beklenir; false: soru tam belirtilmiş,
#                 varsayım listesi boş olmalı. Ölçüt: makul bir kullanıcı başka bir yorum
#                 bekleyebilir miydi VE o yorum farklı bir sayı verir miydi? İkisi de evetse true.
#                 - Ciro/satış sorusu sipariş durumunu belirtmiyorsa true (iptal/iade dahil mi?).
#                 - "Tüm durumları say", "durumu önemli değil", "tamamlanan" diyorsa o konuda false.
#                 - "Geçen ay" = bir önceki takvim ayı (Türkçede yerleşik kullanım), tek başına true yapmaz.
#                 - Cevaplanamaz sorular false (SQL yoksa varsayım da yok).
#                 Etiketler 7, 8, 13, 14, 15, 17, 18 için true; diğerleri false.
#                 (7, 8, 13, 14: ciroya hangi durumlar girer; 15: hiç satılmayan ürünler dahil mi;
#                  17, 18: oranın paydasına iptal edilen siparişler girer mi.)
#
# "Bugün" 2026-11-20 olarak sabittir (seed_db.py ile aynı): "geçen ay" = Ekim 2026.
# Karşılaştırma sonuç üzerinden yapılır: modelin SQL'i farklı olabilir, sonuç aynı olmalı.

